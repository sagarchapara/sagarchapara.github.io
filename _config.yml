title: "Sagar Chapara — Machine Learning Blog"
description: "Insights and notes on machine learning, deep learning, and applied AI."
repository: "sagarchapara/sagarchapara.github.io"
url: "https://sagarchapara.github.io"
baseurl: ""
timezone: "Asia/Kolkata"
locale: "en-US"
author:
  name: "Sagar Chapara"
  avatar: "/assets/images/avatar.svg"
  bio: "Machine learning engineer exploring theory, practice, and everything in between."
  location: "Hyderabad, India"
  email: "sagar@example.com"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/sagarchapara"

permalink: /:categories/:title/
logo: "/assets/images/logo.svg"

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

remote_theme: "pages-themes/hacker@v0.2.0"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

header_pages:
  - index.md
  - _pages/blog.md
  - _pages/about.md
  - _pages/projects.md
  - _pages/research.md

collections:
  featured:
    output: true
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      mathjax: true
  - scope:
      path: "_pages"
    values:
      layout: default
  - scope:
      path: ""
      type: research
    values:
      layout: default

include:
  - _pages
  - _research

sass:
  style: compressed

footer:
  links:
    - label: "RSS"
      icon: "fas fa-rss"
      url: "/feed.xml"

mathjax:
  enable: true
  provider: mathjax
