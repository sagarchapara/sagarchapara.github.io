title: "Sagar Chapara — Machine Learning Blog"
description: "Insights and notes on machine learning, deep learning, and applied AI."
repository: "sagarchapara/sagarchapara.github.io"
url: "https://sagarchapara.github.io"
baseurl: ""
timezone: "Asia/Kolkata"
locale: "en-US"
author:
  name: "Sagar Chapara"
  avatar: "/assets/images/avatar.svg"
  bio: "Machine learning engineer exploring theory, practice, and everything in between."
  location: "Hyderabad, India"
  email: "sagar@example.com"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/sagarchapara"

permalink: /:categories/:title/
logo: "/assets/images/logo.svg"

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

remote_theme: "mmistakes/minimal-mistakes@4.24.0"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-paginate
minimal_mistakes_skin: dark

github:
  username: sagarchapara

google_analytics: 

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
      comments: false
      mathjax: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "main"
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      mathjax: true
      toc: false
      sidebar:
        nav: "main"
collections:
  featured:
    output: true
  research:
    output: true
    permalink: /research/:path/

paginate: 6
paginate_path: /blog/page:num/
search: true
search_full_content: true
search_provider: lunr

include:
  - _pages
  - _research

sass:
  style: compressed

footer:
  links:
    - label: "RSS"
      icon: "fas fa-rss"
      url: "/feed.xml"

mathjax:
  enable: true
  provider: mathjax
