      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="rad" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.6" />
